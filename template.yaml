AWSTemplateFormatVersion: '2010-09-09'
Description: 'Multi-AZ VPC with Public/Private Subnets, NAT Gateways, and SSM Access'

Parameters:
  # Fetches the latest Amazon Linux 2023 AMI automatically
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: Lab-VPC}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref VPC, InternetGatewayId: !Ref InternetGateway}

  # --- SUBNETS (1 Public, 1 Private per AZ) ---
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: Public-Subnet-AZ1}]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: Public-Subnet-AZ2}]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.0.10.0/24
      Tags: [{Key: Name, Value: Private-Subnet-AZ1}]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      CidrBlock: 10.0.11.0/24
      Tags: [{Key: Name, Value: Private-Subnet-AZ2}]

  # --- NAT GATEWAY (Placed in Public Subnet 1) ---
  NAT1EIP:
    Type: AWS::EC2::EIP
    Properties: {Domain: vpc}
  NATGateway1:
    Type: AWS::EC2::NATGateway
    Properties:
      AllocationId: !GetAtt NAT1EIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  # --- ROUTING ---
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  PublicRoute:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}

  PublicAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet1}
  PublicAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet2}

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref PrivateRouteTable, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NATGateway1}

  PrivateAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnet1}
  PrivateAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnet2}

  # --- IAM & SECURITY ---
  SSMInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
  SSMInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref SSMInstanceRole]}

  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and Internal ICMP
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 10.0.0.0/16}

  # --- INSTANCES ---
  WebInstance1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnet1 # Re-referenced
      IamInstanceProfile: !Ref SSMInstanceProfile
      SecurityGroupIds: [!Ref WebSG]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Full Name: Ernest Brayce</h1><h2>Lab: Multi-AZ Fault Tolerant VPC</h2>" > /var/www/html/index.html
      Tags: [{Key: Name, Value: Web-Server-AZ1}]

  WebInstance2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnet2 # Re-referenced
      IamInstanceProfile: !Ref SSMInstanceProfile
      SecurityGroupIds: [!Ref WebSG]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Full Name: Ernest Brayce</h1><h2>Lab: Multi-AZ Fault Tolerant VPC</h2>" > /var/www/html/index.html
      Tags: [{Key: Name, Value: Web-Server-AZ2}]

  AppInstance1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PrivateSubnet1 # Re-referenced
      IamInstanceProfile: !Ref SSMInstanceProfile
      SecurityGroupIds: [!Ref WebSG]
      Tags: [{Key: Name, Value: App-Server-AZ1}]

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC

  PublicSubnet1Id:
    Description: Public Subnet AZ1
    Value: !Ref PublicSubnet1

  PublicSubnet2Id:
    Description: Public Subnet AZ2
    Value: !Ref PublicSubnet2

  PrivateSubnet1Id:
    Description: Private Subnet AZ1
    Value: !Ref PrivateSubnet1

  PrivateSubnet2Id:
    Description: Private Subnet AZ2
    Value: !Ref PrivateSubnet2

  WebInstance1Id:
    Description: Web Server AZ1 Instance ID
    Value: !Ref WebInstance1

  WebInstance2Id:
    Description: Web Server AZ2 Instance ID
    Value: !Ref WebInstance2

  AppInstance1Id:
    Description: App Server AZ1 Instance ID
    Value: !Ref AppInstance1

  AppInstance2Id:
    Description: App Server AZ2 Instance ID
    Value: !Ref AppInstance2

  AppInstance1URL:
    Description: Private URL for App Instance
    Value: !Sub "http://${AppInstance1.PrivateIp}"

  AppInstance2URL:
    Description: Private URL for App Instance
    Value: !Sub "http://${AppInstance2.PrivateIp}"

  WebInstance1URL:
    Description: Public URL for Web Server
    Value: !Sub "http://${WebInstance1.PublicIp}"

  WebInstance2URL:
    Description: Public URL for Web Server
    Value: !Sub "http://${WebInstance2.PublicIp}"

